[package]
name = "rdpinstall"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Web installer Windows/RDP — Rust + React SPA + KVM Reinstall"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
tower-http = { version = "0.7", features = ["trace", "limit"] }
dotenvy = "0.15"
hmac = "0.13"
sha2 = "0.11"
aes-gcm = "0.11"
base64 = "0.23"
hex = "0.4"
getrandom = "0.4"
time = "0.3"
subtle = "2"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "charset", "rustls", "rustls-native-certs"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
