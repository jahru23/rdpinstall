# /etc/nginx/sites-available/install.jaystore.top -> symlink ke sites-enabled
server {
    listen 80;
    listen [::]:80;
    server_name install.jaystore.top;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name install.jaystore.top;

    ssl_certificate     /etc/letsencrypt/live/install.jaystore.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/install.jaystore.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Cloudflare ada di depan: percayai header aslinya
    real_ip_header CF-Connecting-IP;

    client_max_body_size 64k;

    location = /healthz {
        proxy_pass http://127.0.0.1:8791/healthz;
        access_log off;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # progress job live (SSE): jangan di-buffer, jangan putus di tengah
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
