# install.jaystore.top — rdpinstall (Rust/axum, 127.0.0.1:8791)
# Cloudflare Flexible: browser HTTPS -> Cloudflare -> origin HTTP :80
# Pasang: cp ke /etc/nginx/sites-available/ lalu symlink ke sites-enabled, nginx -t, reload

upstream rdpinstall_gw {
    server 127.0.0.1:8791;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name install.jaystore.top;

    include /etc/nginx/conf.d/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    # akses langsung ke origin (bukan lewat Cloudflare) ditolak
    if ($http_cf_connecting_ip = "") {
        return 403;
    }

    client_max_body_size 64k;

    location = /healthz {
        proxy_pass http://rdpinstall_gw/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://rdpinstall_gw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Connection "";

        # progres job live (SSE): jangan di-buffer, jangan putus di tengah
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
